# Release workflow for Memento Mori Obsidian plugin.
#
# RELEASE PROCESS (run locally before pushing a tag):
#   1. npm version patch|minor|major   — bumps package.json AND manifest.json (via `version` script) AND commits
#   2. git push && git push --tags     — triggers this workflow
#
# The workflow builds main.js and attaches main.js + manifest.json to the
# GitHub release. Obsidian's BRAT plugin (and the community plugin registry)
# fetch these two files from the release assets.
#
# IMPORTANT: The git tag, package.json version, and manifest.json version
# must all match. Using `npm version` with the lifecycle script ensures this.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
